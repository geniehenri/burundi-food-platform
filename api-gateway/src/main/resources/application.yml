spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
              - HEAD
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Content-Disposition
              - Content-Type
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/utilisateurs/**,/api/auth/**
        - id: parcelle-service
          uri: lb://parcelle-service
          predicates:
            - Path=/api/parcelles/**,/api/cultures/**,/api/plantations/**,/api/pluviometrie/**
        - id: elevage-service
          uri: lb://elevage-service
          predicates:
            - Path=/api/animaux/**,/api/veterinaires/**,/api/actes-veterinaires/**
        - id: intrant-service
          uri: lb://intrant-service
          predicates:
            - Path=/api/engrais/**,/api/commandes/**

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:burundiFoodSystemSecretKeyForJwtTokenGeneration2024VeryLongKeyMinimum512Bits}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes,metrics
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted

logging:
  level:
    org.springframework.cloud.gateway: INFO
    bi.gov.burundi.gateway: DEBUG