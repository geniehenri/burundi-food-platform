spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # ============ USER-SERVICE ============
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/utilisateurs/**,/api/auth/**

        # ============ PARCELLE-SERVICE ============
        - id: parcelle-service
          uri: lb://parcelle-service
          predicates:
            - Path=/api/parcelles/**,/api/cultures/**,/api/plantations/**,/api/pluviometrie/**

        # ============ ELEVAGE-SERVICE ============
        - id: elevage-service
          uri: lb://elevage-service
          predicates:
            - Path=/api/animaux/**,/api/veterinaires/**,/api/actes-veterinaires/**

        # ============ INTRANT-SERVICE ============
        - id: intrant-service
          uri: lb://intrant-service
          predicates:
            - Path=/api/engrais/**,/api/commandes/**

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:burundiFoodSystemSecretKeyForJwtTokenGeneration2024VeryLongKeyMinimum512Bits}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes,metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
      access: unrestricted

logging:
  level:
    org.springframework.cloud.gateway: INFO
    bi.gov.burundi.gateway: DEBUG