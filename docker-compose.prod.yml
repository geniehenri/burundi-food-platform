services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: burundi-food-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - burundi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  discovery-service:
    build:
      context: ./burundifood
      dockerfile: Ddiscovery-service/ockerfile
    container_name: discovery-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    ports:
      - "8761:8761"
    networks:
      - burundi-network

  api-gateway:
    build:
      context: ./burundifood/api-gateway
    container_name: api-gateway
    restart: always
    depends_on:
      - discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - burundi-network

  user-service:
    build:
      context: ./burundifood/user-service
    container_name: user-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - burundi-network

  parcelle-service:
    build:
      context: ./burundifood/parcelle-service
    container_name: parcelle-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
    networks:
      - burundi-network

  elevage-service:
    build:
      context: ./backend-springboot/elevage-service
    container_name: elevage-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
    networks:
      - burundi-network

  intrant-service:
    build:
      context: ./burundifood/intrant-service
    container_name: intrant-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
    networks:
      - burundi-network

  web-nodejs:
    build:
      context: ./web-nodejs
    container_name: web-nodejs
    restart: always
    environment:
      NODE_ENV: production
      SPRING_API_URL: http://api-gateway:8080/api
      SESSION_SECRET: ${JWT_SECRET}
      PORT: 3000
    depends_on:
      - api-gateway
    ports:
      - "3000:3000"
    networks:
      - burundi-network

volumes:
  postgres_prod_data:

networks:
  burundi-network:
    driver: bridge