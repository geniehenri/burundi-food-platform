services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: burundi-food-db
    restart: always
    environment:
      POSTGRES_DB: burundi_food
      POSTGRES_USER: burundi_admin
      POSTGRES_PASSWORD: BurundiFood2024!
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - burundi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burundi_admin -d burundi_food"]
      interval: 10s
      timeout: 5s
      retries: 5

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    ports:
      - "8761:8761"
    networks:
      - burundi-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: always
    depends_on:
      - discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      JWT_SECRET: burundiFoodSystemSecretKeyForJwtTokenGeneration2024VeryLongKeyMinimum512Bits
    ports:
      - "8000:8080"
    networks:
      - burundi-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/burundi_food
      SPRING_DATASOURCE_USERNAME: burundi_admin
      SPRING_DATASOURCE_PASSWORD: BurundiFood2024!
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      JWT_SECRET: burundiFoodSystemSecretKeyForJwtTokenGeneration2024VeryLongKeyMinimum512Bits
    networks:
      - burundi-network

  parcelle-service:
    build:
      context: .
      dockerfile: parcelle-service/Dockerfile
    container_name: parcelle-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/burundi_food
      SPRING_DATASOURCE_USERNAME: burundi_admin
      SPRING_DATASOURCE_PASSWORD: BurundiFood2024!
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    networks:
      - burundi-network

  elevage-service:
    build:
      context: .
      dockerfile: elevage-service/Dockerfile
    container_name: elevage-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/burundi_food
      SPRING_DATASOURCE_USERNAME: burundi_admin
      SPRING_DATASOURCE_PASSWORD: burundifood2026
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    networks:
      - burundi-network

  intrant-service:
    build:
      context: .
      dockerfile: intrant-service/Dockerfile
    container_name: intrant-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/burundi_food
      SPRING_DATASOURCE_USERNAME: burundi_admin
      SPRING_DATASOURCE_PASSWORD: BurundiFood2024!
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    networks:
      - burundi-network

  web-nodejs:
    build:
      context: ./web-nodejs
      dockerfile: Dockerfile
    container_name: web-nodejs
    restart: always
    environment:
      NODE_ENV: production
      SPRING_API_URL: http://api-gateway:8080/api
      SESSION_SECRET: burundiFoodSecretForSession2024
      PORT: 3000
    depends_on:
      - api-gateway
    ports:
      - "3000:3000"
    networks:
      - burundi-network

volumes:
  postgres_prod_data:

networks:
  burundi-network:
    driver: bridge